    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0; /* Slate 200 */
        }

        .gold-text {
            background: linear-gradient(to bottom, #fcd34d, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border {
            border-color: #d97706;
        }

        .card-bg {
            background-color: #1e293b; /* Slate 800 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .input-dark {
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
        }
        
        .input-dark:focus {
            border-color: #f59e0b;
            outline: none;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        select.input-dark {
            color-scheme: dark;
        }

        .input-error {
            border-color: #ef4444 !important; /* Red-500 */
            background-color: #450a0a; /* Red-950 */
        }

        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
        }

        /* Firefox */
        input[type=number] {
        -moz-appearance: textfield;
        }
        
        .operator-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #64748b; /* Slate 500 */
            font-weight: bold;
        }

        .target-input-group {
            min-width: 0;
        }

        .target-result-number {
            text-shadow: 0 0 18px rgba(245, 158, 11, 0.22);
        }

        .journey-scroll {
            overflow-x: auto;
            padding: 0.5rem 0 0.75rem;
            scrollbar-color: #475569 #0f172a;
            scrollbar-width: thin;
        }

        .journey-track {
            position: relative;
            display: flex;
            width: 100%;
            min-width: max-content;
            align-items: flex-start;
        }

        .journey-track::before {
            content: '';
            position: absolute;
            z-index: 0;
            top: 2.7rem;
            left: 0.75rem;
            right: 2.25rem;
            height: 4px;
            background: linear-gradient(90deg, #f59e0b 0%, #f8d27a 55%, #60a5fa 100%);
        }

        .journey-segment {
            flex: 1 0 180px;
            min-width: 180px;
        }

        .journey-final {
            flex: 0 0 72px;
            min-width: 72px;
        }

        .journey-level {
            margin-bottom: 0.75rem;
            color: #f8fafc;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.25;
        }

        .journey-final .journey-level {
            text-align: center;
        }

        .journey-marker-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
        }

        .journey-node {
            display: block;
            width: 1.5rem;
            height: 1.5rem;
            flex: 0 0 1.5rem;
            border: 4px solid #f8d27a;
            border-radius: 9999px;
            background: #1e293b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.08);
        }

        .journey-node-current {
            border-color: #fbbf24;
            background: #f59e0b;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.65);
        }

        .journey-node-target {
            margin-inline: auto;
            border-color: #60a5fa;
            background: #2563eb;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        .journey-line {
            display: block;
            height: 4px;
            flex: 1;
            background: transparent;
        }

        .journey-days {
            margin-top: 0.75rem;
            margin-left: 1.5rem;
            color: #fbbf24;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
        }

        @media (max-width: 640px) {
            .journey-scroll {
                overflow-x: visible;
            }

            .journey-track {
                display: block;
                min-width: 0;
            }

            .journey-track::before {
                display: none;
            }

            .journey-segment,
            .journey-final {
                display: grid;
                min-width: 0;
                grid-template-columns: 4.25rem 2rem minmax(0, 1fr);
                grid-template-areas: "level marker days";
                align-items: start;
            }

            .journey-segment {
                min-height: 5rem;
            }

            .journey-final {
                min-height: 2rem;
            }

            .journey-level,
            .journey-final .journey-level {
                grid-area: level;
                margin: 0;
                padding-top: 0.125rem;
                text-align: left;
            }

            .journey-marker-row {
                grid-area: marker;
                height: 5rem;
                flex-direction: column;
                align-items: center;
            }

            .journey-line {
                width: 4px;
                height: auto;
                flex: 1;
                background: linear-gradient(180deg, #f59e0b 0%, #f8d27a 55%, #60a5fa 100%);
            }

            .journey-days {
                grid-area: days;
                margin: 0;
                padding: 0.125rem 0 0 0.75rem;
                text-align: left;
            }

            .journey-final .journey-node {
                grid-area: marker;
                margin: 0 auto;
            }
        }
    </style>
</head>

        function getTableData(level) {
            return xpTable.find(d => d.level === level);
        }

        // Calculate Total Experience based on Level and Percent
        function calculateTotalExp(level, percent) {
            if (level < 1) return 0;
            
            const currentLevelData = getTableData(level);
            if (!currentLevelData) return 0; // Out of range
            
            let prevCumulative = 0;
            if (level > 1) {
                const prevLevelData = getTableData(level - 1);
                if (prevLevelData) {
                    prevCumulative = prevLevelData.cumulative;
                }
            }

            const progressExp = currentLevelData.upgrade * (percent / 100);
            return prevCumulative + progressExp;
        }

        // Inverse: Find Level and Percent from Total XP
        function calculateLevelAndPercent(totalExp) {
            let foundLevel = 0;
            let foundPercent = 0;

            const maxData = xpTable[xpTable.length - 1];
            if (totalExp >= maxData.cumulative) {
                return { level: maxData.level, percent: 100.0000 };
            }

            for (let i = 0; i < xpTable.length; i++) {
                const data = xpTable[i];
                if (totalExp < data.cumulative) {
                    foundLevel = data.level;
                    
                    let startExp = 0;
                    if (i > 0) {
                        startExp = xpTable[i-1].cumulative;
                    }

                    const expInLevel = totalExp - startExp;
                    foundPercent = (expInLevel / data.upgrade) * 100;
                    
                    return { level: foundLevel, percent: foundPercent };
                }
            }
            
            return { level: 93, percent: 100 };
        }

        function validateInputs() {
            const mainLvlInput = document.getElementById('mainLevel');
            const subLvlInput = document.getElementById('subLevel');
            const mainError = document.getElementById('mainLevelError');
            const subError = document.getElementById('subLevelError');
            
            const mainLvl = parseInt(mainLvlInput.value) || 0;
            const subLvl = parseInt(subLvlInput.value) || 0;
            
            if (mainLvl < 85) {
                mainLvlInput.classList.add('input-error');
                mainError.classList.remove('hidden');
            } else {
                mainLvlInput.classList.remove('input-error');
                mainError.classList.add('hidden');
            }

            if (subLvl < 80) {
                subLvlInput.classList.add('input-error');
                subError.classList.remove('hidden');
            } else {
                subLvlInput.classList.remove('input-error');
                subError.classList.add('hidden');
            }
        }

        function calculateMerge() {
            // Validate inputs visually
            validateInputs();

            const mainLvl = parseInt(document.getElementById('mainLevel').value) || 1;
            const mainPct = parseFloat(document.getElementById('mainPercent').value) || 0;
            const subLvl = parseInt(document.getElementById('subLevel').value) || 1;
            const subPct = parseFloat(document.getElementById('subPercent').value) || 0;
            
            // Check if any critical input is missing before calculating
            if (!mainLvl || !subLvl || mainPct === null || subPct === null) {
                document.getElementById('resultLevel').innerText = '--';
                document.getElementById('resultPercent').innerText = '--';
                document.getElementById('progressBar').style.width = '0%';
                return;
            }

            const radios = document.getElementsByName('ratio');
            let ratio = 0.8;
            for (const r of radios) {
                if (r.checked) {
                    ratio = parseFloat(r.value);
                    break;
                }
            }

            const mainTotal = calculateTotalExp(mainLvl, mainPct);
            const subTotal = calculateTotalExp(subLvl, subPct);
            
            const gainedExp = subTotal * ratio;
            const newTotalExp = mainTotal + gainedExp;

            const result = calculateLevelAndPercent(newTotalExp);

            document.getElementById('resultLevel').innerText = result.level;
            document.getElementById('resultPercent').innerText = result.percent.toFixed(4);
            
            const bar = document.getElementById('progressBar');
            bar.style.width = Math.min(result.percent, 100) + '%';
        }

        function getLevelStartExp(level) {
            if (level <= 1) return 0;
            const previousLevelData = getTableData(level - 1);
            return previousLevelData ? previousLevelData.cumulative : null;
        }

        function formatWholeNumber(value) {
            return new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 }).format(value);
        }

        function formatPercent(value) {
            return new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 4 }).format(value);
        }

        function setTargetInputInvalid(input, isInvalid) {
            input.classList.toggle('input-error', isInvalid);
            input.setAttribute('aria-invalid', isInvalid ? 'true' : 'false');
        }

        function populateLevelSelect(select, minLevel, maxLevel, selectedValue = '') {
            select.innerHTML = '<option value="">請選擇等級</option>';

            for (let level = minLevel; level <= maxLevel; level++) {
                const option = document.createElement('option');
                option.value = String(level);
                option.textContent = `${level} 級`;
                select.appendChild(option);
            }

            const selectedLevel = Number(selectedValue);
            if (Number.isInteger(selectedLevel) && selectedLevel >= minLevel && selectedLevel <= maxLevel) {
                select.value = String(selectedLevel);
            }
        }

        function initializeTargetLevelSelects() {
            populateLevelSelect(document.getElementById('targetCurrentLevel'), 1, 92);
            populateLevelSelect(document.getElementById('targetGoalLevel'), 2, 93);
        }

        function handleCurrentLevelChange() {
            const currentLevelSelect = document.getElementById('targetCurrentLevel');
            const targetLevelSelect = document.getElementById('targetGoalLevel');
            const currentLevel = Number(currentLevelSelect.value);
            const previousTarget = targetLevelSelect.value;
            const minimumTarget = Number.isInteger(currentLevel) && currentLevel >= 1
                ? currentLevel + 1
                : 2;

            populateLevelSelect(targetLevelSelect, minimumTarget, 93, previousTarget);
            calculateTargetTime();
        }

        function showTargetPrompt() {
            const allInputs = [
                document.getElementById('targetCurrentLevel'),
                document.getElementById('targetCurrentPercent'),
                document.getElementById('targetDailyPercent'),
                document.getElementById('targetGoalLevel')
            ];

            allInputs.forEach(input => setTargetInputInvalid(input, false));

            const error = document.getElementById('targetError');
            error.textContent = '';
            error.classList.add('hidden');
            document.getElementById('targetDays').textContent = '--';
            document.getElementById('targetDuration').textContent = '請選擇等級並輸入經驗值後查看結果';
            const journey = document.getElementById('targetJourney');
            journey.innerHTML = '';
            journey.setAttribute('aria-label', '升級旅程');
            document.getElementById('targetBasis').textContent = '每日成長會依目前等級換算成固定經驗值';
        }

        function showTargetError(message, invalidInputs = []) {
            const allInputs = [
                document.getElementById('targetCurrentLevel'),
                document.getElementById('targetCurrentPercent'),
                document.getElementById('targetDailyPercent'),
                document.getElementById('targetGoalLevel')
            ];

            allInputs.forEach(input => setTargetInputInvalid(input, invalidInputs.includes(input)));

            const error = document.getElementById('targetError');
            error.textContent = message;
            error.classList.remove('hidden');
            document.getElementById('targetDays').textContent = '--';
            document.getElementById('targetDuration').textContent = '請修正輸入資料後查看結果';
            document.getElementById('targetJourney').innerHTML = '';
            document.getElementById('targetBasis').textContent = '每日成長會依目前等級換算成固定經驗值';
        }

        function renderJourney(segments, currentLevel, targetLevel) {
            const journey = document.getElementById('targetJourney');
            journey.setAttribute('aria-label', `從 ${currentLevel} 級升到 ${targetLevel} 級的預估旅程`);

            const segmentMarkup = segments.map((segment, index) => `
                <div class="journey-segment">
                    <div class="journey-level">Lv.${segment.from}</div>
                    <div class="journey-marker-row" aria-hidden="true">
                        <span class="journey-node ${index === 0 ? 'journey-node-current' : ''}"></span>
                        <span class="journey-line"></span>
                    </div>
                    <div class="journey-days">${formatWholeNumber(segment.days)} 天</div>
                </div>
            `).join('');

            journey.innerHTML = `
                <div class="journey-track">
                    ${segmentMarkup}
                    <div class="journey-final">
                        <div class="journey-level">Lv.${targetLevel}</div>
                        <span class="journey-node journey-node-target" aria-hidden="true"></span>
                    </div>
                </div>
            `;
        }

        function calculateTargetTime() {
            const currentLevelInput = document.getElementById('targetCurrentLevel');
            const currentPercentInput = document.getElementById('targetCurrentPercent');
            const dailyPercentInput = document.getElementById('targetDailyPercent');
            const targetLevelInput = document.getElementById('targetGoalLevel');
            const inputs = [currentLevelInput, currentPercentInput, dailyPercentInput, targetLevelInput];

            inputs.forEach(input => setTargetInputInvalid(input, false));
            document.getElementById('targetError').classList.add('hidden');

            const currentLevel = Number(currentLevelInput.value);
            const currentPercent = Number(currentPercentInput.value);
            const dailyPercent = Number(dailyPercentInput.value);
            const targetLevel = Number(targetLevelInput.value);

            if (inputs.some(input => input.value.trim() === '')) {
                showTargetPrompt();
                return;
            }

            if (!Number.isInteger(currentLevel) || currentLevel < 1 || currentLevel > 92) {
                showTargetError('目前等級必須是 1 到 92 之間的整數。', [currentLevelInput]);
                return;
            }

            if (!Number.isFinite(currentPercent) || currentPercent < 0 || currentPercent >= 100) {
                showTargetError('目前經驗值必須介於 0% 到 99.9999% 之間。', [currentPercentInput]);
                return;
            }

            if (!Number.isFinite(dailyPercent) || dailyPercent <= 0) {
                showTargetError('每日成長經驗必須大於 0%。', [dailyPercentInput]);
                return;
            }

            if (!Number.isInteger(targetLevel) || targetLevel < 2 || targetLevel > 93) {
                showTargetError('目標等級必須是 2 到 93 之間的整數。', [targetLevelInput]);
                return;
            }

            if (targetLevel <= currentLevel) {
                showTargetError('目標等級必須高於目前等級。', [targetLevelInput]);
                return;
            }

            const currentLevelData = getTableData(currentLevel);
            const targetExp = getLevelStartExp(targetLevel);
            if (!currentLevelData || targetExp === null) {
                showTargetError('找不到對應的等級經驗資料，請重新輸入。', [currentLevelInput, targetLevelInput]);
                return;
            }

            const currentTotalExp = calculateTotalExp(currentLevel, currentPercent);
            const dailyExp = currentLevelData.upgrade * (dailyPercent / 100);
            const remainingExp = targetExp - currentTotalExp;
            const daysNeeded = Math.ceil(remainingExp / dailyExp);

            if (!Number.isFinite(daysNeeded) || daysNeeded <= 0) {
                showTargetError('目前資料無法產生有效的預估天數。', inputs);
                return;
            }

            const years = Math.floor(daysNeeded / 365);
            const days = daysNeeded % 365;
            document.getElementById('targetDays').textContent = formatWholeNumber(daysNeeded);
            document.getElementById('targetDuration').textContent = years > 0
                ? `約 ${years} 年 ${days} 天`
                : `約 ${daysNeeded} 天`;
            document.getElementById('targetBasis').textContent = `每日固定使用 Lv.${currentLevel} 的 ${formatPercent(dailyPercent)}% 經驗值換算`;

            const segments = [];
            let previousBoundaryDay = 0;
            for (let nextLevel = currentLevel + 1; nextLevel <= targetLevel; nextLevel++) {
                const boundaryExp = getLevelStartExp(nextLevel);
                const cumulativeBoundaryDay = Math.ceil((boundaryExp - currentTotalExp) / dailyExp);
                segments.push({
                    from: nextLevel - 1,
                    to: nextLevel,
                    days: Math.max(0, cumulativeBoundaryDay - previousBoundaryDay)
                });
                previousBoundaryDay = cumulativeBoundaryDay;
            }

            renderJourney(segments, currentLevel, targetLevel);
        }
        
        // Initialize the level menus without preselecting user data.
        window.onload = () => {
            initializeTargetLevelSelects();
            calculateMerge();
            calculateTargetTime();
        }
    </script>
